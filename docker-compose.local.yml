# =============================================================================
# Taxibrousse Local Docker Compose
# Services are ordered by startup priority (dependencies first)
# =============================================================================

services:

  # ===========================================================================
  # TIER 0 - Core Infrastructure (no dependencies)
  # ===========================================================================

  postgres:
    image: postgres:18-alpine
    container_name: taxibrousse-postgres
    environment:
      POSTGRES_DB: taxibrousse
      POSTGRES_USER: ${DATABASE_USERNAME:-taxibrousse}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-taxibrousse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-taxibrousse} -d taxibrousse" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taxibrousse-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taxibrousse
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # TIER 3 - Application Services (depend on Tier 0 + Tier 1)
  # ===========================================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxibrousse-api
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/taxibrousse
      DATABASE_USERNAME: ${DATABASE_USERNAME:-taxibrousse}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-taxibrousse}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
      TAXIBROUSSE_URL: http://localhost:3000
      # Override production ddl-auto for local dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # CORS configuration for local development
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:5173,http://localhost:8081
      # Enable payment mocking locally
      APP_PAYMENT_MOCK: "true"
      # OAuth placeholders for local dev
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-local-fb-id}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-local-fb-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-secret}
      LOGGING_FILE_NAME: /taxibrousse/logs/taxibrousse-api.log
    ports:
      - "8080:8080"
    volumes:
      - ./front:/taxibrousse/front
      - api_logs:/taxibrousse/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxibrousse
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: taxibrousse-cms
    env_file: ./cms/.env
    environment:
      DATABASE_HOST: postgres
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxibrousse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-cms"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:1337/_health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ===========================================================================
  # TIER 4 - Frontend Applications (depend on Tier 3)
  # ===========================================================================

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_CMS_API_URL: http://localhost:1337/api
        VITE_CMS_API_KEY: 76e3cb93535d3bb0202778f64cc212be01959f500d8972ec7297f1c31ada26ef7f859f389f1daedc72bd2b8ef2991c6379c22e0d35e7ba3fd99936f6834ca03f93268c58ca9a70e2f1638073b8056e432ccfefc51cf2f4d2473022c2a3f082a91e429b9448c8028c490f3b9b24cedf2a1fa0dd90ccb39b10361c91296f1c4871
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-id}
        VITE_FACEBOOK_APP_ID: ${FACEBOOK_CLIENT_ID:-local-fb-id}
    container_name: taxibrousse-front
    environment:
      NODE_ENV: production
      PORT: 3000
      SSR_VITE_API_URL: http://api:8080/api
      SSR_VITE_CMS_API_URL: http://cms:1337/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      cms:
        condition: service_healthy
    networks:
      - taxibrousse
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_DOMAIN_MAIN: localhost:8080
        VITE_ENV: development
        VITE_DEBUG: "true"
    container_name: taxibrousse-dashboard
    env_file: ./dashboard/.env
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8080/api
      VITE_DOMAIN_MAIN: localhost:8080
    ports:
      - "3001:3001"
    volumes:
      - ./dashboard/src:/app/src
    networks:
      - taxibrousse
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  location:
    build:
      context: ./location
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_CMS_API_URL: http://localhost:1337/api
        VITE_CMS_API_KEY: 76e3cb93535d3bb0202778f64cc212be01959f500d8972ec7297f1c31ada26ef7f859f389f1daedc72bd2b8ef2991c6379c22e0d35e7ba3fd99936f6834ca03f93268c58ca9a70e2f1638073b8056e432ccfefc51cf2f4d2473022c2a3f082a91e429b9448c8028c490f3b9b24cedf2a1fa0dd90ccb39b10361c91296f1c4871
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-id}
        VITE_FACEBOOK_APP_ID: ${FACEBOOK_CLIENT_ID:-local-fb-id}
    container_name: taxibrousse-location
    environment:
      NODE_ENV: production
      SSR_VITE_API_URL: http://api:8080/api
      SSR_VITE_CMS_API_URL: http://cms:1337/api
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
      cms:
        condition: service_healthy
    networks:
      - taxibrousse
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # TIER 5 - Monitoring (Grafana + Loki + Promtail + Prometheus)
  # Grafana    → http://localhost:3030  (admin / admin)
  # Prometheus → http://localhost:9090
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: taxibrousse-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5.0
    container_name: taxibrousse-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - taxibrousse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.5.0
    container_name: taxibrousse-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker socket so Promtail can discover containers and read their logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - api_logs:/var/log/taxibrousse-api:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-promtail"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: taxibrousse-grafana
    environment:
      GF_SERVER_DOMAIN: admin.taxibrousse.mg
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3030:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-grafana"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  taxibrousse:
    driver: bridge
    name: taxibrousse

volumes:
  postgres_data:
    driver: local
    name: taxibrousse_postgres_data
  redis_data:
    driver: local
  api_logs:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
