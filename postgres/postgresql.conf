# =============================================================================
# PostgreSQL Configuration for TaxiBrousse
# =============================================================================
# This extends the default PostgreSQL settings with enhanced logging
# for Kibana/Elastic Stack integration.

# ---- Connection Settings ----
listen_addresses = '*'
port = 5432
max_connections = 100

# ---- Memory Settings ----
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ---- WAL Settings ----
wal_buffers = 16MB
max_wal_size = 1GB
min_wal_size = 80MB

# ---- Timezone Settings ----
timezone = 'Indian/Antananarivo'
log_timezone = 'Indian/Antananarivo'

# ---- Query Tuning ----
random_page_cost = 1.1
effective_io_concurrency = 200

# =============================================================================
# Logging Configuration (for Elastic Stack / Kibana Integration)
# =============================================================================

# Enable logging
logging_collector = on
log_destination = 'csvlog'

# Log file location & rotation
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_file_mode = 0644
log_truncate_on_rotation = off

# What to log
log_min_messages = warning
log_min_error_statement = error

# Slow query logging (queries taking longer than 500ms)
log_min_duration_statement = 500

# Log connections and disconnections
log_connections = on
log_disconnections = on

# Log lock waits
log_lock_waits = on
deadlock_timeout = 1s

# Log checkpoints
log_checkpoints = on

# Log line prefix (for non-CSV format fallback)
log_line_prefix = '%m [%p] %q%u@%d '

# Log duration of completed statements
log_duration = off

# Log statements
log_statement = 'ddl'

# Log temp file usage (files larger than 10MB)
log_temp_files = 10240
