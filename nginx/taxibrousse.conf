events {
    worker_connections 2048;
}

http {
    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enhanced logging
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'upstream_addr=$upstream_addr '
                       'upstream_status=$upstream_status '
                       'request_time=$request_time '
                       'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/json 
        application/xml;

    # Upstream services
    upstream backend {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream cms {
        server cms:1337 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream front {
        server front:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream dashboard {
        server dashboard:3001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream kibana {
        server kibana:5601 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=cms:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=kibana:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

    # Caching
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m;
    
    # Cache expiration map
    map $sent_http_content_type $expires {
        default                             off;
        ~image/                             1y;
        text/css                            1y;
        application/javascript              1y;
        ~font/                              1y;
        application/woff                    1y;
        application/woff2                   1y;
    }

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Shared proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # HTTP server for main application and CMS
    server {
        listen 80;
        server_name taxibrousse.mg www.taxibrousse.mg cms.taxibrousse.mg;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location /health {
            proxy_pass http://backend/actuator/health;
            access_log off;
        }

        location = /actuator/health {
            proxy_pass http://backend/actuator/health;
            access_log off;
        }

        # WebSocket routes (for SockJS fallback)
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        
        # API routes to backend
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        
        # All other traffic to SSR frontend
        location / {
            proxy_pass http://front;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # HTTP server for dashboard
    server {
        listen 80;
        server_name dashboard.taxibrousse.mg;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location /health {
            proxy_pass http://backend/actuator/health;
            access_log off;
        }

        # WebSocket routes for messaging
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        
        # API routes to backend
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        
        # Dashboard application
        location / {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # HTTP server for admin (Kibana)
    server {
        listen 80;
        server_name admin.taxibrousse.mg;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location /health {
            proxy_pass http://kibana/api/status;
            access_log off;
        }
        
        # Kibana application
        location / {
            proxy_pass http://kibana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            # WebSocket support for Kibana real-time updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Main Application (HTTPS - from system nginx proxy)
    server {
        listen 443 ssl;
        http2 on;
        server_name taxibrousse.mg www.taxibrousse.mg;

        ssl_certificate /etc/letsencrypt/live/taxibrousse.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taxibrousse.mg/privkey.pem;

        # Trust X-Forwarded headers from system nginx
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Security headers (system nginx already adds some, but keep for defense in depth)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # WebSocket proxy with upgrade headers
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Payment callbacks - server-to-server, no rate limiting
        location ~ ^/api/payments/(mvola|orangemoney|airtelmoney)/callback {
            proxy_pass http://backend;
        }

        # API endpoints with caching
        location /api {
            # Cache read-heavy endpoints
            set $cache_zone "";
            if ($uri ~ "^/api/(gares|koperatives|routes)") {
                set $cache_zone "api_cache";
            }
            proxy_cache $cache_zone;
            proxy_cache_valid 200 5m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status always;
            
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 10M;
            proxy_pass http://backend;
        }

        # Actuator endpoints - proxy to backend API
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow Spring Boot Admin to access
            # Restrict to admin server IP if needed in production
            # allow 172.18.0.0/16;  # Docker network
            # deny all;
        }

        # CMS admin proxy
        location /admin {
            limit_req zone=admin burst=5 nodelay;
            proxy_pass http://cms;
        }

        # CMS uploads
        location /uploads {
            client_max_body_size 100M;
            proxy_pass http://cms;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Status endpoints
        location /nginx-status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            access_log off;
        }
        
        location /nginx-health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Main application with caching
        location / {
            expires $expires;
            add_header Cache-Control "public, immutable" always;
            proxy_pass http://front;
        }

        # Security - block sensitive files
        location ~ /\.(ht|git|env) {
            deny all;
            return 404;
        }
    }

    # CMS Administration (HTTPS - from system nginx proxy)
    server {
        listen 443 ssl;
        http2 on;
        server_name cms.taxibrousse.mg;

        ssl_certificate /etc/letsencrypt/live/taxibrousse.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taxibrousse.mg/privkey.pem;

        # Trust X-Forwarded headers from system nginx
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Security headers (CMS-specific)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Root redirect
        location = / {
            return 301 https://cms.taxibrousse.mg/admin;
        }

        # Admin interface
        location /admin {
            limit_req zone=admin burst=5 nodelay;
            proxy_pass http://cms/admin;
            proxy_buffering off;
        }

        # CMS API
        location /api {
            limit_req zone=cms burst=20 nodelay;
            proxy_pass http://cms/api;
        }

        # All other CMS routes with caching
        location / {
            expires $expires;
            add_header Cache-Control "public, immutable" always;
            proxy_pass http://cms;
        }

        # Security - block sensitive files
        location ~ /\.(ht|git|env) {
            deny all;
            return 404;
        }
    }

    # Dashboard Application (HTTPS - from system nginx proxy)
    server {
        listen 443 ssl;
        http2 on;
        server_name dashboard.taxibrousse.mg;

        ssl_certificate /etc/letsencrypt/live/taxibrousse.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taxibrousse.mg/privkey.pem;

        # Trust X-Forwarded headers from system nginx
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # WebSocket proxy for dashboard messaging
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # API endpoints for dashboard
        location /api {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
        }

        # Dashboard application with caching
        location / {
            expires $expires;
            add_header Cache-Control "public, immutable" always;
            proxy_pass http://dashboard;
        }

        # Security - block sensitive files
        location ~ /\.(ht|git|env) {
            deny all;
            return 404;
        }
    }

    # Kibana Application (HTTPS - from system nginx proxy)
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.taxibrousse.mg;

        ssl_certificate /etc/letsencrypt/live/taxibrousse.mg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taxibrousse.mg/privkey.pem;

        # Trust X-Forwarded headers from system nginx
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Health check
        location = /api/status {
            proxy_pass http://kibana/api/status;
            access_log off;
        }

        # Kibana application with rate limiting
        location / {
            limit_req zone=kibana burst=10 nodelay;
            proxy_pass http://kibana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Kibana real-time updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Increase timeouts for long-running Kibana queries
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Security - block sensitive files
        location ~ /\.(ht|git|env) {
            deny all;
            return 404;
        }
    }
}