<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application en cours de démarrage - Taxibrousse</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f6f6f7;
            color: #011638;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border: 1px solid rgba(1, 22, 56, 0.12);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(1, 22, 56, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(1, 22, 56, 0.1);
            border-radius: 50%;
            border-top-color: #011638;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #011638;
            letter-spacing: -0.01em;
        }
        p {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.6;
            margin: 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(1, 22, 56, 0.3);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Mise en route de l'application</h1>
        <p>Le service redémarre ou est en cours de maintenance. Cette page s'actualisera automatiquement dès que l'application sera disponible.</p>
        <div class="footer">Taxibrousse &copy; 2026</div>
    </div>
    <script>
        // Auto reload page every 4 seconds to check if service is back
        setTimeout(function() {
            window.location.reload();
        }, 4000);
    </script>
</body>
</html>
