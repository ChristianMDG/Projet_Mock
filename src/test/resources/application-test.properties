# Test profile configuration for H2 in-memory database

# =============================================================================
# DATABASE - H2 in PostgreSQL compatibility mode
# =============================================================================
spring.datasource.url=jdbc:h2:mem:taxibrousse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Disable data.sql for tests
spring.sql.init.mode=never

# =============================================================================
# SECURITY - Minimal config for tests
# =============================================================================
jwt.public.key=classpath:public.key
jwt.private.key=classpath:private.key

# =============================================================================
# REDIS - Disabled for integration tests
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# =============================================================================
# OAUTH2 - Dummy values for tests
# =============================================================================
spring.security.oauth2.client.registration.facebook.client-id=test-fb-id
spring.security.oauth2.client.registration.facebook.client-secret=test-fb-secret
spring.security.oauth2.client.registration.facebook.redirect-uri=http://localhost:8080/api/auth/facebook/callback
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/auth/google/callback

# =============================================================================
# MVola - Test configuration
# =============================================================================
mvola.client-id=test-client-id
mvola.client-secret=test-client-secret
mvola.mvola-base-url=https://test-mvola.example.com
mvola.partner-name=TaxibrousseTest
mvola.callback-url=http://localhost:8080/api/payments/mvola/callback
mvola.user-account-msisdn=0343500003
mvola.credit-party-msisdn=0343500004
mvola.payment.timeout.minutes=1

# =============================================================================
# Orange Money - Dummy values for tests
# =============================================================================
orangemoney.client-id=test-om-id
orangemoney.client-secret=test-om-secret
orangemoney.base-url=https://test-om.example.com
orangemoney.merchant-code=test-merchant
orangemoney.merchant-name=TaxibrousseTest
orangemoney.callback-url=http://localhost:8080/api/payments/orangemoney/callback
orangemoney.country-code=MG
orangemoney.currency=MGA

# =============================================================================
# Orange SMS - Dummy values
# =============================================================================
orange.sms.url=https://test-sms.example.com
orange.sms.auth-url=https://test-sms.example.com/oauth
orange.sms.sender-address=+000000
orange.sms.token=TEST

# =============================================================================
# SERVER
# =============================================================================
server.port=0
app.frontend.url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# =============================================================================
# LOGGING - Minimal for tests
# =============================================================================
logging.level.root=WARN
logging.level.mg.taxibrousse=DEBUG
logging.level.org.springframework.test=INFO

# =============================================================================
# SPRING BATCH - Use H2 for batch metadata
# =============================================================================
spring.batch.jdbc.initialize-schema=always
