spring.application.name=Taxibrousse

# Active profile (use 'local' for development, 'production' for deployment)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taxibrousse}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:taxibrousse}
spring.datasource.password=${DATABASE_PASSWORD:taxibrousse}

# HikariCP Configuration (optimized for slow networks)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}

# Database initialization
spring.sql.init.platform=postgres
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.separator=;

# Hibernate properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.implicit-strategy=mg.taxibrousse.config.ImplicitNamingStrategyTaxibrousse

# Hibernate batch processing (reduce DB round-trips)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =============================================================================
# SECURITY & JWT CONFIGURATION
# =============================================================================
jwt.public.key=classpath:public.key
jwt.private.key=classpath:private.key

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.servlet.session.store-dir=${java.io.tmpdir}/taxibrousse-sessions

# HTTP Compression for slow networks (4G optimization)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# HTTP/2 Support for multiplexing (reduces latency on slow connections)
server.http2.enabled=true

# Connection timeout optimized for slow 4G networks
server.netty.connection-timeout=30s

# Thread pool optimization for concurrent requests
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# =============================================================================
# OAUTH2 CONFIGURATION
# =============================================================================
# Facebook OAuth Configuration
# Create credentials on: https://developers.facebook.com/apps
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:xx}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:xx}
spring.security.oauth2.client.registration.facebook.redirect-uri=${TAXIBROUSSE_URL:http://localhost:8080}/api/auth/facebook/callback

# Google OAuth2 Configuration
# Create credentials on: https://console.cloud.google.com/apis/credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:xx}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:xx}
spring.security.oauth2.client.registration.google.redirect-uri=${TAXIBROUSSE_URL:http://localhost:8080}/api/auth/google/callback

# =============================================================================
# APPLICATION URLS & CORS
# =============================================================================
app.frontend.url=${TAXIBROUSSE_URL:http://localhost:3000}
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8080,http://localhost:8081

# =============================================================================
# REDIS CONFIGURATION
# =============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

# Connection pool settings for high concurrency
spring.data.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:20}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:10}
spring.data.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:5}

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.enable-statistics=true

# =============================================================================
# JACKSON JSON CONFIGURATION
# =============================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-null-map-values=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.REQUIRE_HANDLERS_FOR_JAVA8_TIMES=false

