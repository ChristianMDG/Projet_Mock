spring.application.name=Taxibrousse

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database initialization
spring.sql.init.mode=never

# Hibernate properties for production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.implicit-strategy=mg.taxibrousse.config.ImplicitNamingStrategyTaxibrousse

# =============================================================================
# SECURITY & JWT CONFIGURATION
# =============================================================================
jwt.public.key=classpath:public.key
jwt.private.key=classpath:private.key

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=${PORT:8080}
server.servlet.context-path=/

# Server error handling
server.error.include-message=always

# OAuth2 Configuration - Use environment variables for security
# Facebook OAuth Configuration
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.redirect-uri=${TAXIBROUSSE_URL}/api/auth/facebook/callback

# Google OAuth2 Configuration  
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${TAXIBROUSSE_URL}/api/auth/google/callback

# Application URLs - Use environment variables
app.frontend.url=${TAXIBROUSSE_URL}

# CORS Configuration - All allowed domains
app.cors.allowed-origins=https://taxibrousse.mg,https://www.taxibrousse.mg,https://dashboard.taxibrousse.mg,https://cms.taxibrousse.mg,https://admin.taxibrousse.mg

# =============================================================================
# REDIS CONFIGURATION
# =============================================================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

# Connection pool settings for high concurrency
spring.data.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:20}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:10}
spring.data.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:5}

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Jackson JSON Configuration (mirror dev defaults)
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-null-map-values=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.REQUIRE_HANDLERS_FOR_JAVA8_TIMES=false
spring.jackson.time-zone=Indian/Antananarivo

# =============================================================================
# PRODUCTION OPTIMIZATIONS
# =============================================================================
# Logging configuration
logging.level.root=WARN
logging.level.mg.taxibrousse=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.data=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=/taxibrousse/logs/taxibrousse-api.log

# Connection pool optimization for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JVM optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =============================================================================
# MOBILE MONEY PAYMENT CONFIGURATION
# =============================================================================

