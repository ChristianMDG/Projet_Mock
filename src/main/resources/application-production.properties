airtelmoney.client-id=${AIRTELMONEY_CLIENT_ID:884bb4e9-60d5-4a1f-a113-939665271f9c}
airtelmoney.client-secret=${AIRTELMONEY_CLIENT_SECRET:a22eb3cc-e01c-45e3-a0b0-fd0dbb0d2a85}
airtelmoney.base-url=${AIRTELMONEY_BASE_URL:https://openapi.airtel.mg}
airtelmoney.country=MG
airtelmoney.currency=MGA
airtelmoney.partner-name=${AIRTELMONEY_PARTNER_NAME:Taxibrousse}
airtelmoney.callback-url=${TAXIBROUSSE_URL}/api/payments/airtelmoney/callback

# =============================================================================
# ORANGE SMS API CONFIGURATION
# =============================================================================
orange.sms.url=https://api.orange.com/smsmessaging/v1
orange.sms.auth-url=https://api.orange.com/oauth/v3/token
orange.sms.sender-address=${ORANGE_SENDER_ADDRESS:+697790}
orange.sms.token=${ORANGE_SMS_TOKEN:TXB}

# Actuator Configuration for Production
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,logfile
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.logfile.access=unrestricted
management.endpoint.logfile.external-file=/taxibrousse/logs/taxibrousse-api.log

# Disable heavy/slow endpoints in production
management.endpoint.heapdump.access=none
management.endpoint.threaddump.access=none
management.endpoint.beans.access=none
management.endpoint.mappings.access=none
management.endpoint.configprops.access=none

management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.git.enabled=true
management.info.build.enabled=true

# Metrics configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Security for actuator endpoints
management.endpoints.web.base-path=/actuator

# Info endpoint details
info.app.name=Taxibrousse API
info.app.description=API reservation des Taxibrousse de Madagascar - Production
info.app.version=1.0.1
info.app.encoding=UTF-8
info.app.java.version=21
