mvola.mvola-base-url=${MVOLA_BASE_URL:https://api.mvola.mg}
mvola.partner-name=${MVOLA_PARTNER_NAME:Taxibrousse}
mvola.callback-url=${TAXIBROUSSE_URL}/api/payments/mvola/callback
mvola.user-account-msisdn=${MVOLA_USER_ACCOUNT_MSISDN:0343500003}
