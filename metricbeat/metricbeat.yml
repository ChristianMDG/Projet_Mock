# =============================================================================
# Metricbeat Configuration - Application Observability
# =============================================================================

metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# =============================================================================
# Server Monitoring - System Metrics
# =============================================================================
metricbeat.modules:
  - module: system
    period: 10s
    hostfs: /hostfs
    metricsets:
      - cpu
      - load
      - memory
      - network
      - process
      - process_summary
      - socket_summary
      - filesystem
      - fsstat
      - diskio
      - entropy
    process.include_top_n:
      by_cpu: 10
      by_memory: 10
    processes: ['.*']
    cpu.metrics: [percentages, normalized_percentages, ticks]
    core.metrics: [percentages, ticks]
    filesystem.ignore_types:
      - nfs
      - sysfs
      - autofs
      - overlay
      - tmpfs
      - proc
      - devtmpfs
      - devpts
      - cgroup
      - cgroup2
      - pstore
      - securityfs
      - hugetlbfs
      - mqueue
      - debugfs
      - tracefs
      - binfmt_misc
      - nsfs
      - bpf

  # System Uptime
  - module: system
    period: 15m
    metricsets:
      - uptime

# =============================================================================
# Docker Monitoring - Container Metrics
# =============================================================================
  - module: docker
    metricsets:
      - container
      - cpu
      - diskio
      - healthcheck
      - info
      - memory
      - network
      - image
      - event
    hosts: ["unix:///var/run/docker.sock"]
    period: 10s
    enabled: true

# =============================================================================
# PostgreSQL Monitoring - Database Metrics
# =============================================================================
  - module: postgresql
    enabled: true
    metricsets:
      - database
      - bgwriter
      - activity
    period: 10s
    hosts: ["postgres://postgres:5432/taxibrousse?sslmode=disable"]
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

# =============================================================================
# Redis Monitoring - Cache Metrics (memory, hit/miss ratio, connections, keyspace)
# =============================================================================
  - module: redis
    enabled: true
    period: 10s
    metricsets:
      - info
      - keyspace
    hosts: ["redis:6379"]

# =============================================================================
# Nginx Monitoring - Traffic Metrics (production only; nginx not in local stack)
# =============================================================================
  - module: nginx
    enabled: ${NGINX_ENABLED:false}
    period: 10s
    hosts: ["http://nginx:80"]
    server_status_path: "nginx-status"
    metricsets:
      - stubstatus

# =============================================================================
# HTTP Monitoring - Application Health Endpoints
# =============================================================================
  - module: http
    enabled: true
    period: 30s
    hosts:
      - "http://api:8080/actuator/health"
    metricsets:
      - json
    namespace: "api_health"
    method: GET
    response.include_body: "on_error"

  # JVM Heap Memory
  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/jvm.memory.used"]
    metricsets: [json]
    namespace: "api_jvm_memory_used"
    method: GET

  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/jvm.memory.max"]
    metricsets: [json]
    namespace: "api_jvm_memory_max"
    method: GET

  # JVM Threads
  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/jvm.threads.live"]
    metricsets: [json]
    namespace: "api_jvm_threads_live"
    method: GET

  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/jvm.threads.peak"]
    metricsets: [json]
    namespace: "api_jvm_threads_peak"
    method: GET

  # JVM GC
  - module: http
    enabled: true
    period: 30s
    hosts: ["http://api:8080/actuator/metrics/jvm.gc.pause"]
    metricsets: [json]
    namespace: "api_jvm_gc_pause"
    method: GET

  - module: http
    enabled: true
    period: 30s
    hosts: ["http://api:8080/actuator/metrics/jvm.gc.memory.promoted"]
    metricsets: [json]
    namespace: "api_jvm_gc_memory_promoted"
    method: GET

  # HikariCP Connection Pool
  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/hikaricp.connections.active"]
    metricsets: [json]
    namespace: "api_hikari_active"
    method: GET

  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/hikaricp.connections"]
    metricsets: [json]
    namespace: "api_hikari_total"
    method: GET

  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/hikaricp.connections.pending"]
    metricsets: [json]
    namespace: "api_hikari_pending"
    method: GET

  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/hikaricp.connections.timeout"]
    metricsets: [json]
    namespace: "api_hikari_timeout"
    method: GET

  # HTTP Request Metrics (active users / traffic)
  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/http.server.requests"]
    metricsets: [json]
    namespace: "api_http_requests"
    method: GET

  - module: http
    enabled: true
    period: 15s
    hosts: ["http://api:8080/actuator/metrics/http.server.requests.active"]
    metricsets: [json]
    namespace: "api_http_requests_active"
    method: GET

  # Cache (Redis / Spring Cache)
  - module: http
    enabled: true
    period: 30s
    hosts: ["http://api:8080/actuator/metrics/cache.gets"]
    metricsets: [json]
    namespace: "api_cache_gets"
    method: GET

  # Process CPU used by the JVM
  - module: http
    enabled: true
    period: 10s
    hosts: ["http://api:8080/actuator/metrics/process.cpu.usage"]
    metricsets: [json]
    namespace: "api_process_cpu"
    method: GET

  - module: http
    enabled: true
    period: 30s
    hosts: ["http://front:3000/health"]
    metricsets:
      - json
    namespace: "front_health"
    method: GET
    response.include_body: "on_error"

  - module: http
    enabled: true
    period: 30s
    hosts:
      - "http://cms:1337/_health"
    metricsets:
      - json
    namespace: "cms_health"
    method: GET
    response.include_body: "on_error"

# =============================================================================
# Output Configuration - Send to Elasticsearch
# =============================================================================
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS}"]

# =============================================================================
# Kibana Dashboard Setup
# =============================================================================
setup.kibana:
  host: "http://kibana:5601"

setup.dashboards.enabled: true

# =============================================================================
# Index Template Configuration
# =============================================================================
setup.ilm.enabled: false
setup.template.enabled: true
setup.template.name: "metricbeat"
setup.template.pattern: "metricbeat-*"

# =============================================================================
# Metricbeat Settings
# =============================================================================
name: taxibrousse-metricbeat
tags: ["application", "monitoring", "observability"]

# Disable monitoring (requires paid license)
monitoring.enabled: false

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/metricbeat
  name: metricbeat
  keepfiles: 7
  permissions: 0644

# Processors
processors:
  - add_host_metadata:
      netinfo.enabled: true
      geo:
        # Antananarivo, Madagascar
        location: "-18.9249, 47.5381"
        continent_name: Africa
        country_iso_code: MG
        region_name: Analamanga
        city_name: Antananarivo
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - add_process_metadata:
      match_pids: [process.pid, process.ppid]
      target: ""
      include_fields:
        - process.name
        - process.args
  - add_fields:
      target: ""
      fields:
        environment: ${ENVIRONMENT:production}
        project: taxibrousse
