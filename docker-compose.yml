# =============================================================================
# Taxibrousse Production Docker Compose
# Services are ordered by startup priority (dependencies first)
# =============================================================================

services:

  # ===========================================================================
  # TIER 0 - Core Infrastructure (no dependencies)
  # ===========================================================================

  postgres:
    image: postgres:18-alpine
    container_name: taxibrousse-postgres
    environment:
      TZ: Indian/Antananarivo
      PGTZ: Indian/Antananarivo
      POSTGRES_DB: taxibrousse
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d taxibrousse" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taxibrousse-redis
    environment:
      TZ: Indian/Antananarivo
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taxibrousse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  elasticsearch:
    image: elasticsearch:8.19.11
    container_name: taxibrousse-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - taxibrousse
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # TIER 3 - Application Services (depend on Tier 0 + Tier 1)
  # ===========================================================================

  api:
    image: ${API_IMAGE:-ghcr.io/ofanomezantsoa/taxibrousse-api:latest}
    container_name: taxibrousse-api
    environment:
      # Timezone Configuration
      TZ: Indian/Antananarivo

      # Spring Configuration
      SPRING_PROFILES_ACTIVE: production

      # Database Configuration  
      DATABASE_URL: jdbc:postgresql://postgres:5432/taxibrousse
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      # OAuth2 Configuration
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Application URLs
      TAXIBROUSSE_URL: ${TAXIBROUSSE_URL}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-60000}
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-15}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-8}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-3}

      # Redis Connection Retry Configuration
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 10000
      SPRING_DATA_REDIS_TIMEOUT: 10000
      SPRING_DATA_REDIS_JEDIS_POOL_MAX_WAIT: 10000ms

      # Spring Redis Resilience
      SPRING_REDIS_LETTUCE_SHUTDOWN_TIMEOUT: 100ms
      SPRING_CACHE_REDIS_TIME_TO_LIVE: 600000

      # MVola Configuration
      MVOLA_CLIENT_ID: ${MVOLA_CLIENT_ID}
      MVOLA_CLIENT_SECRET: ${MVOLA_CLIENT_SECRET}
      MVOLA_BASE_URL: ${MVOLA_BASE_URL}
      MVOLA_PARTNER_NAME: ${MVOLA_PARTNER_NAME}
      MVOLA_USER_ACCOUNT_MSISDN: ${MVOLA_USER_ACCOUNT_MSISDN}
      MVOLA_CREDIT_PARTY_MSISDN: ${MVOLA_CREDIT_PARTY_MSISDN}

      # Airtel Money Configuration
      AIRTELMONEY_CLIENT_ID: ${AIRTELMONEY_CLIENT_ID}
      AIRTELMONEY_CLIENT_SECRET: ${AIRTELMONEY_CLIENT_SECRET}
      AIRTELMONEY_BASE_URL: ${AIRTELMONEY_BASE_URL}
      AIRTELMONEY_PARTNER_NAME: ${AIRTELMONEY_PARTNER_NAME}

      # Orange Money Configuration
      ORANGEMONEY_CLIENT_ID: ${ORANGEMONEY_CLIENT_ID}
      ORANGEMONEY_CLIENT_SECRET: ${ORANGEMONEY_CLIENT_SECRET}
      ORANGEMONEY_MERCHANT_KEY: ${ORANGEMONEY_MERCHANT_KEY}

      # Orange SMS Configuration
      ORANGE_SENDER_ADDRESS: ${ORANGE_SENDER_ADDRESS}
      ORANGE_SMS_TOKEN: ${ORANGE_SMS_TOKEN}

      # JVM Production Settings
      JAVA_OPTS: "-Xmx1536m -Xms768m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom -Duser.timezone=Indian/Antananarivo -server"
      JVM_ARGS: "-XX:+UnlockExperimentalVMOptions -XX:+UseCGroupMemoryLimitForHeap"

      # Spring Boot Production Optimizations
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "15"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "300000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "20000"

      # Logging Configuration
      LOGGING_LEVEL_MG_TAXIBROUSSE: "INFO"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "WARN"
      LOGGING_LEVEL_ORG_HIBERNATE: "WARN"
      LOGGING_FILE_NAME: "/taxibrousse/logs/taxibrousse-api.log"

      # Elasticsearch Configuration
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

      # Server Configuration
      PORT: 8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - api_logs:/taxibrousse/logs
    networks:
      - taxibrousse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  cms:
    image: ${CMS_IMAGE:-ghcr.io/ofanomezantsoa/taxibrousse-cms:latest}
    container_name: taxibrousse-cms
    environment:
      TZ: Indian/Antananarivo
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taxibrousse
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: false
      APP_KEYS: ${CMS_APP_KEYS}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${CMS_JWT_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxibrousse
    volumes:
      - cms_uploads:/opt/app/public/uploads
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-cms"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:1337/_health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # TIER 4 - Frontend Applications (depend on Tier 3)
  # ===========================================================================

  front:
    image: ${FRONT_IMAGE:-ghcr.io/ofanomezantsoa/taxibrousse-front:latest}
    container_name: taxibrousse-front
    environment:
      TZ: Indian/Antananarivo
      NODE_ENV: production
      PORT: 3000
      # Runtime environment variables (for SSR)
      VITE_API_URL: ${VITE_API_URL}
      VITE_CMS_API_URL: ${VITE_CMS_API_URL}
      VITE_CMS_API_KEY: ${VITE_CMS_API_KEY}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      VITE_FACEBOOK_APP_ID: ${FACEBOOK_CLIENT_ID}
      VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      cms:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-front"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3000/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/ofanomezantsoa/taxibrousse-dashboard:latest}
    container_name: taxibrousse-dashboard
    environment:
      TZ: Indian/Antananarivo
      NODE_ENV: production
      PORT: 3001
      VITE_API_URL: ${VITE_API_URL}
      DOMAIN_MAIN: ${DOMAIN_MAIN}
      VITE_DOMAIN_MAIN: ${DOMAIN_MAIN}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-dashboard"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3001/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  location:
    image: ${LOCATION_IMAGE:-ghcr.io/ofanomezantsoa/taxibrousse-location:latest}
    container_name: taxibrousse-location
    environment:
      TZ: Indian/Antananarivo
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
      VITE_CMS_API_URL: ${VITE_CMS_API_URL}
      VITE_CMS_API_KEY: ${VITE_CMS_API_KEY}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      VITE_FACEBOOK_APP_ID: ${FACEBOOK_CLIENT_ID}
      VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      api:
        condition: service_healthy
      cms:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-location"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3000/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # TIER 5 - Reverse Proxy (depends on Tier 3 + Tier 4)
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: taxibrousse-nginx
    environment:
      TZ: Indian/Antananarivo
    volumes:
      - ./nginx/taxibrousse.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/502.html:/usr/share/nginx/html/502.html:ro
      - /opt/taxibrousse/certbot/conf:/etc/letsencrypt:ro
      - /opt/taxibrousse/certbot/www:/var/www/certbot:ro
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
      cms:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      location:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: taxibrousse-certbot
    volumes:
      - /opt/taxibrousse/certbot/conf:/etc/letsencrypt
      - /opt/taxibrousse/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - taxibrousse
    restart: unless-stopped

  # ===========================================================================
  # TIER 6 - Monitoring (Prometheus + Loki + Promtail + Grafana)
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: taxibrousse-prometheus
    environment:
      TZ: Indian/Antananarivo
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-prometheus"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  loki:
    image: grafana/loki:3.5.0
    container_name: taxibrousse-loki
    environment:
      TZ: Indian/Antananarivo
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-loki"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  promtail:
    image: grafana/promtail:3.5.0
    container_name: taxibrousse-promtail
    environment:
      TZ: Indian/Antananarivo
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - api_logs:/var/log/taxibrousse-api:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-promtail"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  grafana:
    image: grafana/grafana:11.6.0
    container_name: taxibrousse-grafana
    environment:
      TZ: Indian/Antananarivo
      GF_SERVER_DOMAIN: admin.taxibrousse.mg
      GF_SERVER_ROOT_URL: "https://admin.taxibrousse.mg/"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - taxibrousse
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=taxibrousse-grafana"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

networks:
  taxibrousse:
    driver: bridge
    name: taxibrousse

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  cms_uploads:
    driver: local
  api_logs:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  elasticsearch_data:
    driver: local
