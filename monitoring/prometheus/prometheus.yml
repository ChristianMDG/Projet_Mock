global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: taxibrousse
    env: local

scrape_configs:
  # ── Spring Boot API (Micrometer /actuator/prometheus) ────────────────────────
  - job_name: taxibrousse-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'api:8080' ]
        labels:
          service: api
          tier: backend

  # ── Prometheus self-monitoring ───────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]
