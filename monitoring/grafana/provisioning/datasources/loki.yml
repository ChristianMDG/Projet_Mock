apiVersion: 1

datasources:
  # ── Loki (logs) ──────────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    version: 1
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          url: '/explore?left=["now-1h","now","loki",{"expr":"{container=~\"taxibrousse-api|/taxibrousse-api\"} |= \"$1\""}]'
        - name: Logger
          matcherRegex: '"logger_name":"([^"]+)"'
          url: '/explore?left=["now-1h","now","loki",{"expr":"{container=~\"taxibrousse-api|/taxibrousse-api\"} | json | logger_name=\"$1\""}]'

  # ── Prometheus (metrics) ─────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    version: 1
    editable: false
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: traceId
          datasourceUid: loki
