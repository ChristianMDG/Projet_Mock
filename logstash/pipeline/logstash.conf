input {
  # TCP input for structured logs from applications (JSON format)
  tcp {
    port => 5000
    codec => json { ecs_compatibility => "disabled" }
    type => "app-logs"
  }

  # UDP input for lightweight logging
  udp {
    port => 5000
    codec => json { ecs_compatibility => "disabled" }
    type => "app-logs"
  }

  # Beats input for Filebeat integration (future expansion)
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # =========================================================================
  # Filebeat log processing (logs arriving from port 5044 via Beats input)
  # =========================================================================
  if [type] == "beats" or [agent][type] == "filebeat" {
    # Map Docker container name to service field for routing
    if [container][name] {
      mutate {
        copy => { "[container][name]" => "service" }
      }
      # Strip "taxibrousse-" prefix from container name for cleaner service names
      mutate {
        gsub => [ "service", "^taxibrousse-", "" ]
      }
    }

    # Add ECS-compatible fields for Kibana Logs app
    if ![event][dataset] {
      mutate {
        add_field => { "[event][dataset]" => "docker.container.logs" }
      }
    }
    if ![event][module] {
      mutate {
        add_field => { "[event][module]" => "docker" }
      }
    }
  }

  # =========================================================================
  # Filebeat Module Routing - Use ECS-compliant index patterns
  # =========================================================================
  # Filebeat modules (postgresql, nginx, etc.) set event.dataset and event.module
  # Route these to standard ECS indices for Kibana integration compatibility
  if [event][dataset] and [event][module] {
    # PostgreSQL module: event.dataset = "postgresql.log"
    if [event][dataset] == "postgresql.log" {
      mutate {
        add_field => { "[@metadata][target_index]" => "logs-postgresql.log" }
      }
    }
    # Nginx module: event.dataset = "nginx.access" or "nginx.error"
    else if [event][dataset] =~ /^nginx\./ {
      mutate {
        add_field => { "[@metadata][target_index]" => "logs-%{[event][dataset]}" }
      }
    }
    # Generic fallback for other modules
    else {
      mutate {
        add_field => { "[@metadata][target_index]" => "logs-%{[event][dataset]}" }
      }
    }
  }

  # Ensure timestamp is properly parsed
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Parse Spring Boot logs (API service)
  if [service] == "api" or [service] == "taxibrousse-api" {
    # Add service identifier
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-api" }
      add_field => { "service_type" => "spring-boot" }
    }

    # Parse stack traces if present
    if [stack_trace] {
      mutate {
        gsub => [ "stack_trace", "\n", " | " ]
      }
    }

    # Grok pattern for Spring Boot logs if message is plain text
    if [message] !~ /^\{/ {
      grok {
        match => {
          "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{NUMBER:pid} --- \[%{DATA:thread}\] %{DATA:logger} : %{GREEDYDATA:log_message}"
        }
      }
    }

    # -------------------------------------------------------------------------
    # User Activity Tracking - Extract authentication & access events
    # -------------------------------------------------------------------------
    # JWT login success: the API emits logs containing the username after auth
    if [message] =~ /(?i)Authentication.*success|Successfully authenticated|JWT.*generated|login.*success|User.*logged in/ {
      mutate {
        add_field => { "[@metadata][target_index]" => "search-txb-user-activity" }
        add_field => { "event_type" => "login_success" }
        add_tag => ["user_activity", "auth_success"]
      }
      grok {
        match => { "message" => "(?i)(user|username|principal)[:\s]+['\"]?%{USERNAME:auth_username}['\"]?" }
        tag_on_failure => []
      }
    }

    # Login failure / bad credentials
    else if [message] =~ /(?i)BadCredentialsException|Login.*fail|Authentication.*fail|Invalid.*credentials|Unauthorized/ {
      mutate {
        add_field => { "[@metadata][target_index]" => "search-txb-user-activity" }
        add_field => { "event_type" => "login_failure" }
        add_tag => ["user_activity", "auth_failure"]
      }
    }

    # JWT token validation errors (expired, invalid signature)
    else if [message] =~ /(?i)JwtException|ExpiredJwt|MalformedJwt|SignatureException|token.*invalid|token.*expired/ {
      mutate {
        add_field => { "[@metadata][target_index]" => "search-txb-user-activity" }
        add_field => { "event_type" => "token_invalid" }
        add_tag => ["user_activity", "token_error"]
      }
    }

    # OAuth2 login (Google / Facebook)
    else if [message] =~ /(?i)OAuth2|oauth2|principal.*social|social.*login|google.*auth|facebook.*auth/ {
      mutate {
        add_field => { "[@metadata][target_index]" => "search-txb-user-activity" }
        add_field => { "event_type" => "oauth2_login" }
        add_tag => ["user_activity", "oauth2"]
      }
    }

    # Reservation events (business activity per user)
    else if [message] =~ /(?i)reservation.*creat|booking.*creat|ticket.*creat/ {
      mutate {
        add_field => { "[@metadata][target_index]" => "search-txb-user-activity" }
        add_field => { "event_type" => "reservation_created" }
        add_tag => ["user_activity", "reservation"]
      }
    }

    # Payment events
    else if [message] =~ /(?i)payment.*success|mvola.*confirm|airtel.*confirm|paiement.*confirm/ {
      mutate {
        add_field => { "[@metadata][target_index]" => "search-txb-user-activity" }
        add_field => { "event_type" => "payment_success" }
        add_tag => ["user_activity", "payment"]
      }
    }
  }

  # Parse Strapi/CMS logs (Node.js)
  if [service] == "cms" or [service] == "taxibrousse-cms" {
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-cms" }
      add_field => { "service_type" => "nodejs" }
    }

    # Strapi logs are typically in JSON format already
    if [message] and [message] =~ /^\{/ {
      json {
        source => "message"
        target => "parsed"
      }
    }
  }

  # Parse Frontend logs (React/Vite)
  if [service] == "front" or [service] == "taxibrousse-front" {
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-front" }
      add_field => { "service_type" => "react" }
    }
  }

  # Parse Dashboard logs
  if [service] == "dashboard" or [service] == "taxibrousse-dashboard" {
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-dashboard" }
      add_field => { "service_type" => "react" }
    }
  }

  # Parse Nginx access logs
  if [service] == "nginx" or [type] == "nginx-access" {
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-nginx" }
      add_field => { "service_type" => "nginx" }
    }

    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:request_method} %{DATA:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:body_bytes_sent} "%{DATA:http_referer}" "%{DATA:http_user_agent}"'
      }
    }

    # Convert numeric fields
    mutate {
      convert => {
        "status" => "integer"
        "body_bytes_sent" => "integer"
      }
    }
  }

  # Parse PostgreSQL logs
  if [service] == "postgres" or [service] == "taxibrousse-postgres" {
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-postgres" }
      add_field => { "service_type" => "postgresql" }
    }

    # PostgreSQL log pattern
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{WORD:log_level}:  %{GREEDYDATA:log_message}"
      }
    }
  }

  # Normalize log levels
  if [log_level] {
    mutate {
      uppercase => [ "log_level" ]
    }
  }

  # Add environment tag if present
  if ![environment] {
    mutate {
      add_field => { "environment" => "production" }
    }
  }

  # Set default target index for unmatched services
  if ![@metadata][target_index] {
    mutate {
      add_field => { "[@metadata][target_index]" => "search-txb-general" }
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host" ]
  }

  # Add geolocation for IP addresses if available
  if [remote_addr] and [remote_addr] !~ /^(10\.|127\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.)/ {
    geoip {
      source => "remote_addr"
      target => "geoip"
    }
  }
}

output {
  # Output to Elasticsearch with dynamic index based on service
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
    # Create daily indices for efficient retention management
    manage_template => true
    template_name => "search-txb"
    template_overwrite => false
  }

  # Debug output to stdout (disabled in production)
  # stdout {
  #   codec => rubydebug
  # }
}
