# =============================================================================
# Filebeat Configuration - Centralized Log Collection
# =============================================================================

# =============================================================================
# Filebeat Modules
# =============================================================================
filebeat.modules:
  # PostgreSQL module - parses CSV logs for Kibana integration
  - module: postgresql
    log:
      enabled: true
      var.paths:
        - /var/log/postgresql/postgresql-*.csv

  # Nginx module - parses access and error logs for Kibana integration
  - module: nginx
    access:
      enabled: true
      var.paths:
        - /var/log/nginx/access.log*
    error:
      enabled: true
      var.paths:
        - /var/log/nginx/error.log*

# Autodiscover Docker containers
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        # Default template for all containers
        - condition:
            contains:
              docker.container.name: "taxibrousse"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - add_docker_metadata:
                    host: "unix:///var/run/docker.sock"

# Manual log inputs for taxibrousse containers
filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
    # Parse JSON logs from containers
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    json.expand_keys: true
    json.message_key: message

    # Multiline support for Java stack traces (Spring Boot API)
    multiline.type: pattern
    multiline.pattern: '^\d{4}-\d{2}-\d{2}|^\{'
    multiline.negate: true
    multiline.match: after

  # PostgreSQL log files (from shared volume)
  - type: log
    enabled: true
    paths:
      - /var/log/postgresql/postgresql-*.csv
    fields:
      service: postgres
      service_type: postgresql
    fields_under_root: true
    # CSV format multiline: continuation lines start with whitespace
    multiline.type: pattern
    multiline.pattern: '^\d{4}-\d{2}-\d{2}'
    multiline.negate: true
    multiline.match: after

  # Nginx log files (from shared volume)
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log*
    fields:
      service: nginx
      service_type: nginx
      event.dataset: nginx.access
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log*
    fields:
      service: nginx
      service_type: nginx
      event.dataset: nginx.error
    fields_under_root: true
    multiline.type: pattern
    multiline.pattern: '^\d{4}/\d{2}/\d{2}'
    multiline.negate: true
    multiline.match: after

# =============================================================================
# Processors
# =============================================================================
processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - add_host_metadata:
      netinfo.enabled: false
  - add_fields:
      target: ""
      fields:
        environment: production
        project: taxibrousse
  # Drop events from non-taxibrousse containers
  - drop_event:
      when:
        not:
          contains:
            container.name: "taxibrousse"

# =============================================================================
# Output - Send to Logstash (Beats input on port 5044)
# =============================================================================
output.logstash:
  hosts: ["logstash:5044"]
  bulk_max_size: 2048
  worker: 1

# =============================================================================
# Kibana - For dashboard loading
# =============================================================================
setup.kibana:
  host: "http://kibana:5601"

setup.dashboards.enabled: false

# =============================================================================
# Index Lifecycle Management
# =============================================================================
setup.ilm.enabled: false
setup.template.enabled: true
setup.template.name: "filebeat"
setup.template.pattern: "filebeat-*"

# =============================================================================
# Logging
# =============================================================================
name: taxibrousse-filebeat
tags: ["logs", "docker", "observability"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
