# Kibana Configuration
# =============================================================================

# Server Configuration
server.name: "kibana"
server.host: "0.0.0.0"
server.port: 5601
server.publicBaseUrl: "https://admin.taxibrousse.mg"

# Elasticsearch Configuration
elasticsearch.hosts: ["http://elasticsearch:9200"]

# =============================================================================
# Stack Monitoring & Observability
# =============================================================================
# Internal collection requires paid license — use Metricbeat external collection instead
monitoring.kibana.collection.enabled: false
monitoring.ui.container.elasticsearch.enabled: true

# =============================================================================
# Fleet / Integrations (Beats management)
# =============================================================================
# Allows Kibana to configure and manage Beats agents

# =============================================================================
# General Settings
# =============================================================================
# Logging
logging.root.level: info
logging.appenders.default:
  type: console
  layout:
    type: json

# Performance tuning
elasticsearch.requestTimeout: 90000
elasticsearch.shardTimeout: 30000

# Default space
xpack.spaces.maxSpaces: 1

# Telemetry
telemetry.enabled: false
telemetry.optIn: false

# Disable new user tutorial
home.disableWelcomeScreen: true

# =============================================================================
# Security Audit Logging - Track every user action in Kibana
# (login, logout, saved object access, dashboard views, API calls)
# Audit events are written to the standard Kibana log output.
# =============================================================================
# =============================================================================
# Stack Monitoring - Container-aware
# =============================================================================
monitoring.ui.container.logstash.enabled: true
